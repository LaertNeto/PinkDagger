<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PinkDagger - Atualizações</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #12141c;
            color: #e2e8f0;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 16px;
        }

        h1 {
            margin: 0 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #5a657d;
            color: #E85D9E;
            font-size: 1.15em;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h2 {
            margin: 16px 0 8px;
            color: #f1c40f;
            font-size: 0.85em;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .versions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .card {
            padding: 10px 12px;
            background: #171a23;
            border: 1px solid #3c4252;
            border-radius: 6px;
        }

        .card small {
            display: block;
            color: #a0aec0;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card strong {
            font-size: 1.3em;
        }

        .status {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #3c4252;
            background: #171a23;
            line-height: 1.45;
        }

        .status.ok { border-color: #2ecc71; }
        .status.warn { border-color: #f1c40f; }
        .status.error { border-color: #e74c3c; }
        .status.highlight { border-color: #E85D9E; }

        .status p {
            margin: 0 0 6px;
        }

        .status p:last-child {
            margin-bottom: 0;
        }

        code {
            padding: 1px 4px;
            background: #0d0f15;
            border-radius: 3px;
            font-size: 0.9em;
            word-break: break-all;
            user-select: all;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background: #E85D9E;
            border: none;
            border-radius: 6px;
            color: #12141c;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            background: #5a657d;
            cursor: default;
        }

        a {
            color: #E85D9E;
        }

        .notes {
            max-height: 200px;
            overflow-y: auto;
            margin: 0;
            padding: 10px 12px;
            background: #171a23;
            border: 1px solid #3c4252;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: inherit;
            font-size: 0.9em;
            color: #cbd5e0;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <main>
        <h1>PinkDagger · Atualizações</h1>

        <div id="updated-banner" class="status ok" hidden></div>

        <div class="versions">
            <div class="card">
                <small>Instalada</small>
                <strong id="current-version">-</strong>
            </div>
            <div class="card">
                <small>Mais recente</small>
                <strong id="latest-version">…</strong>
            </div>
        </div>

        <div id="release-status" class="status">Consultando o GitHub…</div>
        <div id="helper-status" class="status" hidden></div>

        <button id="update-btn" hidden disabled>Atualizar agora</button>

        <section id="notes-section" hidden>
            <h2>Novidades</h2>
            <pre id="release-notes" class="notes"></pre>
        </section>
    </main>
    <script src="update.js"></script>
</body>
</html>
